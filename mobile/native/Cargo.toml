[package]
name = "ciban-native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core = { path = "../../upstream/crates/qingjian-core" }
qingjian-dictionary = { path = "../../upstream/crates/qingjian-dictionary" }
qingjian-translate = { path = "../../upstream/crates/qingjian-translate" }
qingjian-learning = { path = "../../upstream/crates/qingjian-learning" }
qingjian-lm = { path = "../../upstream/crates/qingjian-lm" }
qingjian-format = { path = "../../upstream/crates/qingjian-format" }
serde_json = "1"
jni = "0.21.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
